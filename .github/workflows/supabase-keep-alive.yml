# Wakes free-tier Supabase directly, so the project is not paused for inactivity.
# Does not depend on the website cron secret.
name: Supabase keep-alive

on:
  schedule:
    # Twice daily (UTC). Hobby Vercel only allows 1 cron/day; this covers gaps.
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing GitHub secrets SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          code=$(curl -sS -o /tmp/keepalive.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL%/}/rest/v1/system_pings" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "Supabase did not accept the keep-alive ping"
            exit 1
          fi
